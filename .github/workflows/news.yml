name: Northern Metropolis Digest

on:
  schedule:
    # 08:17 UTC is 16:17 (4:17 PM) Hong Kong Time
    # 1=Mon, 3=Wed, 5=Fri
    - cron: '13 1 * * 1,3,5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # Grant permission to push the cache file back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Funnel
        run: python main.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          # Moved LANGUAGE to a variable as requested
          LANGUAGE: "Traditional Chinese" 
          TZ_OFFSET: ${{ secrets.TZ_OFFSET }}
          HOURS_LOOKBACK: ${{ secrets.HOURS_LOOKBACK }}

      - name: Commit and Push Weekly Cache
        # This only runs if the script succeeded and it's Mon or Wed
        # It saves the JSON file so Friday's run can see it
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . || echo "No changes found"
          git commit -m "Update weekly cache [skip ci]" || echo "No changes to commit"
          git push
        if: success()
